spring:
  application:
    name: retoCP-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:cinetest_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT:8090}

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration-hours: ${JWT_EXPIRATION_HOURS:24}

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /api/docs
    operationsSorter: method
    tagsSorter: alpha
    configUrl: /api/docs-json/swagger-config
    url: /api/docs-json
  api-docs:
    path: /api/docs-json
    enabled: true
